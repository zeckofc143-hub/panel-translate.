<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Translate</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><h1>Panel Translate</h1><p>Tradução de capítulos MangaDex com OCR + IA.</p></header><section class="panel"><input id="url" placeholder="Cole o link de um capítulo do MangaDex"><button id="load">Carregar</button><button id="translate" disabled>Traduzir capítulo</button><span id="status"></span></section><section class="panel"><label>Origem <select id="source"><option value="auto">Auto</option><option value="ja">Japonês</option><option value="ko">Coreano</option><option value="zh">Chinês</option><option value="en">Inglês</option></select></label><label>Destino <select id="target"><option value="pt-BR">Português (Brasil)</option></select></label><label><input type="checkbox" id="safe" checked> modo seguro</label></section><section id="meta"></section><section id="pages"></section></main><script type="module" src="/app.js"></script></body></html>
