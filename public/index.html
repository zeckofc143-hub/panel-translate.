<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Panel Translate</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@500;600;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:wght@400;600;700;800;900&family=Noto+Serif:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><main><header><div><h1>Panel Translate <span>MAX</span></h1><p>OCR, tradução contextual e typesetting automático.</p></div><span id="engine" class="pill">checando IA…</span></header><section class="panel hero"><input id="url" autocomplete="off" placeholder="Cole o link de um capítulo do MangaDex"><button id="load">Carregar capítulo</button><button id="translate" class="primary" disabled>Traduzir tudo</button><button id="stop" disabled>Parar</button><span id="status"></span><progress id="progress" value="0" max="1"></progress></section><section class="panel settings"><label>Origem<select id="source"><option value="auto">Detectar automaticamente</option><option value="ja">Japonês</option><option value="ko">Coreano</option><option value="zh">Chinês</option><option value="en">Inglês</option><option value="es">Espanhol</option></select></label><label>Destino<select id="target"><option value="pt-BR">Português (Brasil)</option></select></label><label>Visualização<select id="view"><option value="translated">Traduzido</option><option value="original">Original</option><option value="compare">Comparar</option></select></label><label class="check"><input type="checkbox" id="safe" checked><span>Redraw seguro</span></label><label class="check"><input type="checkbox" id="preserveSfx"><span>Preservar SFX original</span></label></section><aside class="quality"><b>Modo estável:</b> Gemini faz OCR/layout/tradução e um único renderer local limpa o texto e recompõe os blocos. Sem Replit, sem Hugging Face e sem renderers externos.</aside><section id="meta"></section><section id="pages"></section></main><script type="module" src="/app.js"></script></body></html>
